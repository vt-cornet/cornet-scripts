# =============================================================================
# CORNET Lab DNS Server - dnsmasq Configuration
# Deployed on: cornet-node01 -> LXC 200 (dns-server / 198.82.18.150)
# =============================================================================

# Listen on internal network interface and public cluster IP
listen-address=10.10.0.3,198.82.18.150
bind-dynamic

# Do not read /etc/resolv.conf for upstream DNS
no-resolv

# Forward general DNS queries to Virginia Tech DNS servers
server=198.82.247.66
server=198.82.247.98

# Never forward plain (non-dotted) names upstream
domain-needed

# Never forward addresses in non-routed space
bogus-priv

# Local authoritative domain for CORNET Lab
local=/cornet.wireless.vt.edu/

# Security Hardening
# Only serve local domain — don't act as open resolver
stop-dns-rebind
rebind-localhost-ok

# Limit DNS to local queries only
local-service

# Disable negative caching to prevent cache poisoning
no-negcache

